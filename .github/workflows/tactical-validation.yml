name: Tactical validation
on:
  push:
    branches: [feat/tactiqra-dark-dashboard-v1]
  workflow_dispatch:
    inputs:
      real_match:
        description: Run network-dependent StatsBomb reference tests
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_historical_tactical_intelligence.py -v
  real_match:
    if: github.event_name == 'workflow_dispatch' && inputs.real_match
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_real_match_validation.py -v
        env:
          TACTIQRA_REAL_MATCH_TEST: '1'
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Frontend regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies
        run: npm audit --audit-level=high
